[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Agent memory layer for persistent context, recall, and retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "structlog>=24.0.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "sqlite-utils>=3.36",
  "uvicorn[standard]>=0.32.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[project.scripts]
agent-memory = "agent_memory.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
